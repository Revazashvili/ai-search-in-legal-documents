services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legaldocumentaisearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=legaldocumentaisearch;Username=postgres;Password=postgres"
      OpenAI__BaseUrl: "http://host.docker.internal:11434/v1"
      OpenAI__EmbeddingModel: "nomic-embed-text"
      OpenAI__ChatModel: "llama3.1:8b"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:3001"
    volumes:
      - uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5081
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5081
    depends_on:
      backend:
        condition: service_started

  user-frontend:
    build:
      context: ./frontend/user
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5081
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5081
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  uploads_data:
